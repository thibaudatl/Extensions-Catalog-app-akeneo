services:
    app:
        build:
            context: ./
            target: development
            args:
                USER: "${DOCKER_UID:-1000}"
        environment:
            - HOME=/tmp
            - APP_ENV=${APP_ENV:-dev}
            - PHP_XDEBUG_MODE=${PHP_XDEBUG_MODE:-off}
            - PHP_XDEBUG_CLIENT_HOST=${PHP_XDEBUG_CLIENT_HOST:-172.17.0.1}
            - PHP_XDEBUG_CLIENT_PORT=${PHP_XDEBUG_CLIENT_PORT:-9003}
            - PHP_IDE_CONFIG=serverName=docker-php-server
            - XDEBUG_CONFIG=idekey=docker-php-server
            - DATABASE_URL=${DATABASE_URL}
        depends_on:
            - mysql
        volumes:
            - "./:/srv/app:rw"
        user: "${DOCKER_UID:-1000}"
        restart: unless-stopped
        ports:
            - "${DOCKER_PORT_HTTP:-8000}:80"
        networks:
            - default

    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: app_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: app
            MYSQL_PASSWORD: app
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - default

    adminer:
        image: adminer
        container_name: adminer
        restart: unless-stopped
        ports:
            - "8080:8080"
        networks:
            - default

volumes:
    db_data:

networks:
    default: ~
