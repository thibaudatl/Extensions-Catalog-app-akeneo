framework:
    secret: '%env(APP_SECRET)%'
    session:
        handler_id: null
        cookie_secure: true
        cookie_samesite: strict
        cookie_httponly: true
        gc_maxlifetime: 3600
        storage_factory_id: session.storage.factory.native
    http_client:
        default_options:
            verify_peer: true
            timeout: 30
