parameters:
    app.client_id: '%env(CLIENT_ID)%'
    app.client_secret: '%env(CLIENT_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Security\Encryptor:
        arguments:
            $appSecret: '%env(APP_SECRET)%'
